name: build

# This fork is installed by dsh-config-pack as
# github:Robert-Wang-08/dsh-archived-sessions#vX.Y.Z.
# package.json "prepare" builds lib/ on that git install.
#
# Do not pnpm publish. The package name @jiangdaoli/dsh-archived-sessions
# is owned by the upstream scope; OIDC token exchange and the registry PUT
# both 404 from this repository (ERR_PNPM_AUTH_TOKEN_EXCHANGE).
#
# Trigger: push a tag (vX.Y.Z) or run the workflow manually.
# The job only installs and builds.

on:
  push:
    tags:
      - 'v*'
    branches:
      - cursor/gha-release-build-only-e786
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
